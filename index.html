<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>TimeTraveler</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":9155132,"index.wasm":56718379},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = true;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	// TimeTraveler: the service worker makes the page cross-origin isolated
	// (it adds the headers to what it serves), so the page must be loaded
	// through it, once it's active: wait for that before reloading; and if
	// one is there already but the page isn't isolated (it loaded before the
	// worker took over), reload once more — once only, then say what's missing.
	const reloadKey = 'godot-isolation-reload';
	const session = (f) => { try { return f(window.sessionStorage); } catch (e) { return null; } };
	// TimeTraveler: what's missing an app's own browser (Telegram's,
	// Instagram's…) lacks, any browser has — say so, and give a way there
	// (on Android an intent: the phone's browser opens the page).
	const missingNotice = () => {
		console.error('Missing: ' + missing.join('; '));
		displayFailureNotice('The game can\'t run here.');
		const open = document.createElement('a');
		open.href = /Android/.test(navigator.userAgent)
			? `intent://${location.host}${location.pathname}${location.search}#Intent;scheme=https;end`
			: location.href;
		open.target = '_blank';
		open.rel = 'noopener';
		open.textContent = 'Open in your browser';
		open.style.cssText = 'display: inline-block; margin-top: 1rem; padding: 0.7rem 1.4rem; border-radius: 0.5rem; background: #4a6cb0; color: #fff; text-decoration: none; font-weight: bold;';
		statusNotice.appendChild(open);
	};
	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator
			&& session((s) => s.getItem(reloadKey)) !== '1') {
			Promise.race([
				navigator.serviceWorker.getRegistration()
					.then((registration) => registration || engine.installServiceWorker())
					.then(() => navigator.serviceWorker.ready),
				new Promise((resolve, reject) => {
					setTimeout(() => reject(new Error('The service worker did not start.')), 15000);
				}),
			]).then(() => {
				session((s) => s.setItem(reloadKey, '1'));
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
				missingNotice();
			});
		} else {
			missingNotice();
		}
	} else {
		session((s) => s.removeItem(reloadKey));
		setStatusMode('progress');
		// TimeTraveler: a release newer than the one the service worker
		// serves from its cache, if there's one, taken at once — the worker
		// replaced and the page loaded again through the new one — not only
		// once every tab of the game has been closed. Offline, or if the
		// check takes too long, the game starts as it is.
		newerRelease().then((newer) => {
			if (newer) {
				// It takes the page over and loads it again; where it can't
				// (no WindowClient.navigate), the page does once it's taken.
				navigator.serviceWorker.addEventListener('controllerchange', () => window.location.reload(), { once: true });
				newer.postMessage('update');
			} else {
				startGame();
			}
		});
	}

	function newerRelease() {
		if (!GODOT_CONFIG['serviceWorker'] || !('serviceWorker' in navigator) || !navigator.serviceWorker.controller) {
			return Promise.resolve(null);
		}
		const installed = (worker) => new Promise((resolve) => {
			if (worker.state !== 'installing') {
				resolve(worker.state === 'installed' ? worker : null);
				return;
			}
			worker.addEventListener('statechange', () => {
				if (worker.state !== 'installing') {
					resolve(worker.state === 'installed' ? worker : null);
				}
			});
		});
		return Promise.race([
			navigator.serviceWorker.getRegistration()
				.then((registration) => registration && registration.update()
					.then(() => registration.waiting || (registration.installing && installed(registration.installing)) || null)),
			new Promise((resolve) => setTimeout(() => resolve(null), 5000)),
		]).catch(() => null);
	}

	function startGame() {
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
